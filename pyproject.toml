[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nocturne"
version = "0.1.0"
description = "Local-first agentic music studio: plain-language briefs to editable MIDI, with an Ableton Live bridge"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Michael Heavener" }]
dependencies = ["pydantic>=2", "numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
nocturne = "nocturne.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
