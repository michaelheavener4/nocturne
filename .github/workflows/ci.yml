name: CI

on:
  # Fleet branches are working surfaces: gate branches are SUPPOSED to
  # fail until merged (the gate is written first and the coordinator
  # runs it locally before merging). Running CI on every branch push
  # turned that pattern into failure-notification spam. CI now guards
  # main, pull requests, and manual runs.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e .

      - name: Pytest
        run: |
          if [ -d tests ]; then
            pip install -e ".[dev]"
            python -m pytest -q tests
          else
            echo "tests/ not in this tree; skipping pytest"
          fi

      - name: Demo smoke
        run: |
          nocturne demo --prompt "ci smoke"
          python -c "from pathlib import Path; p=Path('data/projects/nocturne_sketch.mid'); b=p.read_bytes(); assert p.is_file() and len(b) > 14 and b[:4] == b'MThd', (p, len(b), b[:4]); print(p, len(b))"
